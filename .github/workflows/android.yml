# FNC Reborn Android feasibility starter

This is a **hardware/API probe**, not a playable port of FNC Reborn. It provides a minimal Android Studio project that checks whether the device exposes a Vulkan physical device through the Android NDK.

## What this proves
- Android Studio / Gradle project structure
- Kotlin activity calling native C++ through JNI
- NDK and Vulkan loader integrationplugins {
