#include <jni.h>
#include <vulkan/vulkan.h>
#include <string>
#include <vector>

extern "C"
JNIEXPORT jstring JNICALL
Java_com_fnc_reborn_androidprobe_MainActivity_vulkanProbe(JNIEnv* env, jobject) {
    uint32_t apiVersion = VK_API_VERSION_1_0;
    auto enumerateVersion = reinterpret_cast<PFN_vkEnumerateInstanceVersion>(
        vkGetInstanceProcAddr(VK_NULL_HANDLE, "vkEnumerateInstanceVersion"));
    if (enumerateVersion) enumerateVersion(&apiVersion);

    VkApplicationInfo appInfo{};
    appInfo.sType = VK_STRUCTURE_TYPE_APPLICATION_INFO;
    appInfo.pApplicationName = "FNC Reborn Android Probe";
    appInfo.apiVersion = apiVersion;

    VkInstanceCreateInfo createInfo{};
    createInfo.sType = VK_STRUCTURE_TYPE_INSTANCE_CREATE_INFO;
    createInfo.pApplicationInfo = &appInfo;

    VkInstance instance = VK_NULL_HANDLE;
    VkResult result = vkCreateInstance(&createInfo, nullptr, &instance);
    if (result != VK_SUCCESS) {
        std::string message = "Vulkan instance creation failed (VkResult " +
                              std::to_string(static_cast<int>(result)) + ").";
        return env->NewStringUTF(message.c_str());
    }

    uint32_t count = 0;
    result = vkEnumeratePhysicalDevices(instance, &count, nullptr);
    std::string message;
    if (result != VK_SUCCESS || count == 0) {
        message = "No Vulkan physical device was found. Native Android port feasibility is lower on this device.";
    } else {
        std::vector<VkPhysicalDevice> devices(count);
        result = vkEnumeratePhysicalDevices(instance, &count, devices.data());
        VkPhysicalDeviceProperties props{};
        if (result == VK_SUCCESS) {
            vkGetPhysicalDeviceProperties(devices[0], &props);
            message = "Vulkan device found: ";
            message += props.deviceName;
            message += "\nVulkan API: ";
            message += std::to_string(VK_VERSION_MAJOR(props.apiVersion)) + "." +
                       std::to_string(VK_VERSION_MINOR(props.apiVersion)) + "." +
                       std::to_string(VK_VERSION_PATCH(props.apiVersion));
            message += "\nDevices enumerated: " + std::to_string(count);
            message += "\nThis is only a basic capability check, not a performance test.";
        } else {
            message = "Vulkan device enumeration failed.";
        }
    }
    vkDestroyInstance(instance, nullptr);
    return env->NewStringUTF(message.c_str());
}package com.fnc.reborn.androidprobe

import android.app.Activity
import android.os.Bundle
import android.widget.TextView

class MainActivity : Activity() {
    private external fun vulkanProbe(): String

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val result = try {
            vulkanProbe()
        } catch (e: UnsatisfiedLinkError) {
            "Native probe could not load: ${e.message}"
        }

        val view = TextView(this).apply {
            textSize = 18f
            setPadding(32, 48, 32, 32)
            text = "FNC Reborn — Android feasibility probe\n\n$result\n\nThis is not the game. It only checks basic Vulkan device availability."
        }
        setContentView(view)
    }

    companion object {
        init { System.loadLibrary("fnc_probe") }
    }
}



- A first smoke test for the target phone's Vulkan availability

## What it does not do
- It does not run Fight Night Champion or include game code/data.
- It does not port ReXGlue, the Xbox 360 kernel, Direct3D 12 graphics, audio, or input.
- A successful Vulkan probe does not guarantee sufficient performance or compatibility.

## Build
1. Install a current Android Studio.
2. Install Android SDK Platform 35 (or adjust `compileSdk`), NDK (side by side), and CMake through SDK Manager.
3. Open this folder in Android Studio and let Gradle sync.
4. Build and run on an Android 7.0+ device with Vulkan support.

If Gradle requires a newer Android Gradle Plugin or Gradle wrapper, use Android Studio's suggested compatible versions.

## Recommended next technical milestone
Port and build a small, isolated portion of the ReXGlue runtime for `arm64-v8a` without game assets. Do not start by copying the Windows `project/CMakeLists.txt` unchanged: it currently expects generated sources and a `rexglue` package, and the game target uses Windows-specific configuration and Direct3D 12 runtime assumptions.

