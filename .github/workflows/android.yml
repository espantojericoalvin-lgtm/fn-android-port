# Native Android port feasibility assessment

## Verdict
**High difficulty; not a direct conversion.** The uploaded source identifies FNC Reborn as a native Windows x86-64 port. Its runtime uses ReXGlue for static recompilation and console services, and translates the Xbox 360 GPU to Direct3D 12. The repository itself says it requires Windows 10/11, x64, and a Direct3D 12-capable GPU.

## Main blockers
1. **CPU target:** current generated C++ and build assumptions target x86-64. Android's common target is `arm64-v8a`; the recompiler/code-generation/build pipeline must support it and validate PPC semantics on ARM64.
2. **Graphics backend:** Direct3D 12 cannot be used as the native Android graphics API. A Vulkan backend or a proven compatibility translation layer is needed, including shader translation and GPU behavior.
3. **System runtime:** Windows APIs, Xbox kernel services, threading, virtual memory, file APIs, audio, controller input, timers, and synchronization need Android implementations or abstractions.
4. **Build system:** the existing CMake project requires generated sources and a `rexglue` package, and contains Windows-specific build settings. A separate Android CMake target and dependency graph will be needed.
5. **Performance and device coverage:** a boxing game with a large statically recompiled codebase and GPU workload needs profiling on real ARM64 devices. Vulkan presence alone is not sufficient evidence of playability.
6. **Game assets:** the repository explicitly excludes game code/data. Use only game data from the user's own lawful copy; do not bundle copyrighted game assets in an APK or public build.

## Suggested staged plan
- **Stage 0 — device probe:** build and run this project's Vulkan probe on the target phone.
- **Stage 1 — runtime portability audit:** enumerate Windows/D3D12-only includes, APIs, compiler intrinsics, assembly, and SDK dependencies in ReXGlue and FNC Reborn.
- **Stage 2 — ARM64 proof of concept:** compile a small generated-code sample for Android `arm64-v8a`; verify calling conventions, vector operations, exception/fault behavior, and floating-point fidelity.
- **Stage 3 — runtime bring-up:** implement Android platform services and create a minimal Vulkan rendering path.
- **Stage 4 — game boot:** load user-provided game files, reach menus, then test input, sound, save/load, and gameplay.
- **Stage 5 — performance and compatibility:** profile thermals, memory, frame pacing, GPU correctness, and supported devices before calling it playable.

## Go/no-go criteria
Do not invest in a full game port until the team can (a) build ReXGlue runtime code for Android ARM64, (b) render a minimal Xbox 360 GPU workload through Vulkan, and (c) run a representative generated PowerPC code sample correctly. These are the three largest feasibility gates.

